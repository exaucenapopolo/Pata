name: Pata Android APK

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "native/android/**"
      - "public/android-version.json"
      - "src/app/api/sms-import/**"
      - "src/app/telecharger/**"
      - "src/components/SmsImport*.jsx"
      - "src/components/AndroidUpdateChecker.jsx"
      - "src/lib/sms/**"
      - "src/lib/sms/nativePlugin.js"
      - "tests/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publier une APK release signée (nécessite les secrets de signature)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Tester les parseurs SMS
        run: npm run test:sms

      - name: Tester les notifications Web Push
        run: npm run test:notifications

      - name: Vérifier la compilation Next.js de la PWA
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIza00000000000000000000000000000000000"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "pata-build-check.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "pata-build-check"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "pata-build-check.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:000000000000000000000000"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "G-0000000000"
          NEXT_PUBLIC_APP_URL: "https://www.pata-yam.site"
        run: npm run build

      - name: Générer le projet Android Capacitor
        run: |
          npx cap add android
          node native/android/prepare-android.mjs
          npx cap sync android

      - name: Compiler l'APK de vérification
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Afficher les empreintes du certificat Android de test
        run: |
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'
          fi

      - name: Publier l'APK de vérification
        uses: actions/upload-artifact@v4
        with:
          name: pata-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Vérifier les prérequis Google et de signature de la release
        if: ${{ inputs.publish_release == 'true' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[PUBLISH_ANDROID_RELEASE]')) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected_sha1 = "0BAC9BF84355BFEC8CF53CD33C6236DB82C22EE2"
          config = json.loads(Path("native/android/google-services.json").read_text())
          android = next(
              (
                  client for client in config.get("client", [])
                  if client.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.pata.app"
              ),
              None,
          )
          if not android:
              raise SystemExit("Client Firebase Android com.pata.app introuvable.")
          oauth_clients = android.get("oauth_client", [])
          web_clients = [client for client in oauth_clients if client.get("client_type") == 3]
          android_clients = [
              client for client in oauth_clients
              if client.get("client_type") == 1
              and client.get("android_info", {}).get("package_name") == "com.pata.app"
          ]
          matching_release_client = [
              client for client in android_clients
              if "".join(
                  character for character in client.get("android_info", {}).get("certificate_hash", "").upper()
                  if character in "0123456789ABCDEF"
              ) == expected_sha1
          ]
          if not web_clients:
              raise SystemExit("Client OAuth Web absent du google-services.json; connexion Google impossible.")
          if not matching_release_client:
              raise SystemExit(
                  "Le client OAuth Android ne correspond pas au certificat de distribution Pata "
                  "(SHA-1 attendu: 0B:AC:9B:F8:43:55:BF:EC:8C:F5:3C:D3:3C:62:36:DB:82:C2:2E:E2). "
                  "Télécharger le nouveau google-services.json depuis Firebase après l'ajout de l'empreinte."
              )
          print("Configuration Firebase validée: client Web + client Android com.pata.app et certificat de distribution.")
          PY
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Secret de signature manquant: $secret_name"
              exit 1
            fi
          done
          echo "Tous les prérequis de publication sont présents."
      - name: Préparer la signature release
        if: ${{ (inputs.publish_release == 'true' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[PUBLISH_ANDROID_RELEASE]'))) && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/pata-release.jks
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()

          signing = '''
              signingConfigs {
                  release {
                      storeFile file("pata-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''

          # Déclarer la clé avant buildTypes, au niveau du bloc android.
          if not re.search(r"^\s*signingConfigs\s*\{", content, re.MULTILINE):
              build_types = re.search(r"^\s*buildTypes\s*\{", content, re.MULTILINE)
              if not build_types:
                  raise SystemExit("Bloc android.buildTypes introuvable dans android/app/build.gradle")
              content = content[:build_types.start()] + signing + "\n" + content[build_types.start():]

          # Ajouter signingConfig uniquement dans buildTypes.release (et pas dans signingConfigs.release).
          build_types = re.search(r"\bbuildTypes\s*\{", content)
          if not build_types:
              raise SystemExit("Bloc android.buildTypes introuvable")
          build_open = content.find("{", build_types.start())
          depth = 1
          build_close = build_open + 1
          while build_close < len(content) and depth:
              if content[build_close] == "{":
                  depth += 1
              elif content[build_close] == "}":
                  depth -= 1
              build_close += 1
          if depth:
              raise SystemExit("Bloc android.buildTypes mal formé")

          build_block = content[build_open + 1:build_close - 1]
          release_block = re.search(r"\brelease\s*\{", build_block)
          if not release_block:
              raise SystemExit("Bloc android.buildTypes.release introuvable")
          release_open = build_open + 1 + release_block.end() - 1
          release_body_start = release_open + 1
          body_preview = content[release_body_start:build_close]
          if not re.search(r"^\s*signingConfig\s+signingConfigs\.release\b", body_preview, re.MULTILINE):
              content = content[:release_body_start] + "\n            signingConfig signingConfigs.release" + content[release_body_start:]

          path.write_text(content)
          PY
          test -s android/app/pata-release.jks
          keytool -list -keystore android/app/pata-release.jks -storetype JKS -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          CERTIFICATE_DETAILS="$(keytool -list -v -keystore android/app/pata-release.jks -storetype JKS -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")"
          printf '%s\n' "$CERTIFICATE_DETAILS" | grep -E 'SHA1:|SHA256:'
          RELEASE_SHA1="$(printf '%s\n' "$CERTIFICATE_DETAILS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_RELEASE_SHA1="0BAC9BF84355BFEC8CF53CD33C6236DB82C22EE2"
          if [ "$RELEASE_SHA1" != "$EXPECTED_RELEASE_SHA1" ]; then
            echo "La clé de signature configurée ne correspond pas à celle de l'APK actuellement distribuée."
            echo "Empreinte attendue: 0B:AC:9B:F8:43:55:BF:EC:8C:F5:3C:D3:3C:62:36:DB:82:C2:2E:E2"
            echo "Empreinte trouvée: $RELEASE_SHA1"
            exit 1
          fi
          echo "Keystore Android validé, certificat de distribution identique et bloc buildTypes.release configuré."

      - name: Compiler l'APK release signée
        if: ${{ (inputs.publish_release == 'true' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[PUBLISH_ANDROID_RELEASE]'))) && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Pata-Android.apk

      - name: Vérifier cryptographiquement la signature APK
        if: ${{ (inputs.publish_release == 'true' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[PUBLISH_ANDROID_RELEASE]'))) && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose --print-certs Pata-Android.apk

      - name: Archiver l'APK release signée
        if: ${{ (inputs.publish_release == 'true' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[PUBLISH_ANDROID_RELEASE]'))) && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pata-android-release-signed
          path: Pata-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier l'APK de distribution
        if: ${{ (inputs.publish_release == 'true' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[PUBLISH_ANDROID_RELEASE]'))) && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.1.0
          name: Pata Android 1.1.0
          target_commitish: main
          generate_release_notes: true
          overwrite_files: true
          files: Pata-Android.apk

      - name: Activer le lien de téléchargement et le contrôle de version
        if: ${{ (inputs.publish_release == 'true' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[PUBLISH_ANDROID_RELEASE]'))) && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("public/android-version.json")
          data = json.loads(path.read_text())
          data["downloadAvailable"] = True
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/android-version.json
          if git diff --cached --quiet; then
            echo "Les métadonnées Android sont déjà correctes ; aucun commit supplémentaire."
          else
            git commit -m "Publish Pata Android download metadata"
            git push
          fi
