name: Pata Web Quality Checks

on:
  push:
    branches: [main]
    paths:
      - "src/app/**"
      - "src/components/**"
      - "src/lib/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tester les soldes disponibles et le tableau de bord
        run: node --test tests/incomeBalances.test.mjs tests/dashboard-income-balance.test.mjs
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Tester les notifications et leurs quotas existants
        run: npm run test:notifications
      - name: Tester la saisie rapide et les expressions locales
        run: npm run test:quick-capture
      - name: Tester les sources de revenus disponibles dans Quick Capture
        run: npm run test:available-income-sources
      - name: Tester la sélection multiple et la comptabilité des dépenses
        run: npm run test:expense-app-experience
      - name: Tester le clavier de montant Android et la restauration des champs
        run: npm run test:money-keypad
      - name: Tester la visibilité du champ au-dessus de la calculatrice
        run: npm run test:money-keypad-scroll
      - name: Tester les raccourcis flottants et la synchronisation de la WebView Android
        run: npm run test:native-scroll-actions
      - name: Tester le rattachement des paiements SMS aux factures impayées
        run: npm run test:sms-bill-payment
      - name: Tester les analyses et projections par catégorie
        run: npm run test:category-analysis
      - name: Tester le guide court et le guide complet
        run: npm run test:app-tour
      - name: Tester les conseils financiers fondés sur les opérations
        run: npm run test:ai-spending-guidance
      - name: Tester la programmation des opérations
        run: npm run test:scheduled-transactions
      - name: Tester la gestion des dettes, leurs revenus encaissés et leur suppression
        run: npm run test:debt-management
      - name: Tester les résumés de budgets
        run: npm run test:budget-spend-summary
