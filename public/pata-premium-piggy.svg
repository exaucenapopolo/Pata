 <linearGradient id="gold" x1="208" y1="16" x2="280" y2="99" gradientUnits="userSpaceOnUse"><stop stop-color="#fff2b4"/><stop offset=".35" stop-color="#f4c94d"/><stop offset=".72" stop-color="#d99718"/><stop offset="1" stop-color="#a96b0b"/></linearGradient>
