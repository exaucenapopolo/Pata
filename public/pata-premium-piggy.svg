<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Pata Premium</title><desc id="desc">Tirelire blanche aux détails vert profond, avec une pièce et une couronne dorées.</desc>
<defs>
